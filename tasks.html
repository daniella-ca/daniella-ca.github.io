<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --ink: #0A0A0A; --paper: #F5F4EF; --white: #FFFFFF;
    --grey-1: #8B8B8F; --grey-2: #545A5C; --line: #26262A; --line-soft: #E7E7EA;
    --lime: #C6FF3D; --lime-deep: #A6E619; --purple: #7C3AED; --orange: #FF541F;
    --r-xs: 4px; --r-sm: 10px; --r-md: 18px; --r-lg: 28px; --pill: 999px;
    --lift: 0 8px 24px rgba(0,0,0,.08); --float: 0 18px 48px rgba(0,0,0,.2);
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "Manrope", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 400 15px/1.55 var(--sans); color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  a { color: inherit; }

  /* eyebrow */
  .eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--grey-2); }
  .nav .eyebrow { color: var(--grey-1); }

  /* ---------------------------------------------------------------- sign in */
  #auth { min-height: 100%; display: grid; place-items: center; background: var(--ink); color: var(--paper); padding: 24px; }
  #auth form { width: min(380px, 100%); display: grid; gap: 14px; }
  #auth h1 { font: 700 clamp(42px, 6vw, 64px)/.98 var(--sans); letter-spacing: -.028em; margin: 0 0 8px; }
  #auth h1 i { font-style: italic; font-weight: 500; color: var(--lime); }
  #auth input { background: transparent; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; color: var(--paper); }
  #auth input:focus { outline: 2px solid var(--lime-deep); outline-offset: 1px; border-color: transparent; }
  #auth .err { color: var(--grey-1); min-height: 1.5em; font-size: 14px; }
  #auth .remember { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--grey-1); cursor: pointer; user-select: none; }
  #auth .remember input { width: 18px; height: 18px; margin: 0; padding: 0; border: 0; accent-color: var(--lime); cursor: pointer; }

  /* ---------------------------------------------------------------- shell */
  #app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
  .nav { background: var(--ink); color: var(--paper); padding: 28px 18px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; }
  .nav .brand { font: 700 22px/1 var(--sans); letter-spacing: -.02em; margin: 0 6px 22px; }
  .nav .brand i { font-style: normal; color: var(--lime); }
  .nav button { background: transparent; border: 0; color: var(--grey-1); text-align: left; padding: 9px 12px; border-radius: var(--r-sm); display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
  .nav button:hover { color: var(--paper); background: #141416; }
  .nav button.on { color: var(--ink); background: var(--lime); font-weight: 600; }
  .nav button .n { font: 500 11px/1 var(--mono); opacity: .8; }
  .nav button.on .n { opacity: 1; }
  .nav .gap { flex: 1; }
  .nav .sub { color: var(--grey-1); font-size: 12px; padding: 0 12px; }
  .nav .keys { color: var(--grey-1); font-size: 12px; padding: 0 12px 6px; line-height: 1.8; }
  .nav kbd { font: 500 11px/1 var(--mono); border: 1px solid var(--line); border-radius: var(--r-xs); padding: 2px 5px; color: var(--paper); }

  main { padding: 28px clamp(20px, 4vw, 48px) 80px; max-width: 980px; }

  /* quick add */
  #quick { position: sticky; top: 0; z-index: 5; background: var(--paper); padding: 4px 0 18px; }
  #quick .box { display: flex; gap: 10px; align-items: center; background: var(--white); border: 1px solid var(--line-soft); border-radius: var(--pill); padding: 6px 6px 6px 20px; box-shadow: var(--lift); }
  #quick .box:focus-within { border-color: var(--ink); }
  #quick input { flex: 1; border: 0; outline: 0; background: transparent; padding: 8px 0; font-size: 16px; }
  #quick button { background: var(--ink); color: var(--lime); border: 0; border-radius: var(--pill); padding: 10px 18px; font-weight: 600; }
  #quick button:hover { background: #1c1c1f; }
  #quick .preview { font-size: 13px; color: var(--grey-2); padding: 8px 20px 0; min-height: 1.6em; }
  #quick .preview b { color: var(--ink); font-weight: 600; }

  /* sections */
  h2 { font: 700 clamp(26px, 3vw, 34px)/1.05 var(--sans); letter-spacing: -.022em; margin: 8px 0 18px; }
  h2 small { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--grey-2); margin-left: 14px; vertical-align: middle; }
  .group { margin: 0 0 28px; }
  .group .eyebrow { margin: 0 0 10px 4px; }
  .onething { background: var(--ink); color: var(--paper); border-radius: var(--r-lg); padding: 22px 26px; margin: 0 0 22px; display: grid; gap: 6px; }
  .onething .eyebrow { color: var(--lime); }
  .onething .t { font: 600 clamp(20px, 2vw, 26px)/1.15 var(--sans); letter-spacing: -.015em; }
  .onething .meta { color: var(--grey-1); font-size: 13px; }
  .onething .dot { box-shadow: 0 0 0 1.5px var(--paper); }
  .empty { color: var(--grey-2); padding: 18px 4px; }
  .empty b { color: var(--ink); font-weight: 600; }

  /* cards */
  .card { --cc: var(--grey-1); background: var(--white); border: 1px solid var(--line-soft); border-left: 5px solid var(--cc); border-radius: var(--r-md); padding: 14px 16px; margin: 0 0 10px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; transition: box-shadow .2s; }
  .card:hover { box-shadow: var(--lift); }
  .card.doing { outline: 2px solid var(--lime); outline-offset: 0; border-color: var(--ink); border-left-color: var(--cc); box-shadow: var(--lift); }
  .card.paused { background: #FBFAF6; border-style: dashed; border-left-style: solid; }
  .card.waiting { background: #FBF9FE; }
  .card.done { opacity: .72; }
  .card.sortable { grid-template-columns: auto auto 1fr auto; }
  .card.sortable .crumbs { grid-column: 3 / span 2; }
  .grip { border: 0; background: transparent; color: var(--grey-1); font: 15px/1 var(--mono); letter-spacing: -.25em; padding: 6px 8px 6px 2px; margin-top: 1px; cursor: grab; user-select: none; border-radius: var(--r-xs); }
  .grip:hover, .grip:focus { color: var(--ink); background: var(--line-soft); outline: 0; }
  .card.dragging { opacity: .45; }
  .card.over-before { box-shadow: 0 -4px 0 0 var(--lime), var(--lift); }
  .card.over-after { box-shadow: 0 4px 0 0 var(--lime), var(--lift); }
  .group .eyebrow .hint { font: 12px/1 var(--sans); letter-spacing: 0; text-transform: none; color: var(--grey-1); margin-left: 10px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--cc); vertical-align: middle; margin-right: 8px; }
  .nav .legend { display: grid; gap: 2px; padding: 10px 4px 0; border-top: 1px solid var(--line); margin-top: 10px; }
  .nav .legend .eyebrow { margin: 0 8px 6px; font-size: 11px; }
  .nav .legend button { padding: 6px 8px; font-size: 13px; text-transform: capitalize; justify-content: flex-start; }
  .nav .legend .dot { width: 9px; height: 9px; }
  .chip { font: 500 11px/1 var(--mono); letter-spacing: .08em; border-radius: var(--r-xs); padding: 6px 7px; margin-top: 2px; min-width: 24px; text-align: center; }
  .chip.must { background: var(--ink); color: var(--lime); }
  .chip.should { background: var(--line-soft); color: var(--ink); }
  .chip.could { border: 1px solid var(--line-soft); color: var(--grey-2); }
  .chip.none { border: 1px dashed var(--line-soft); color: var(--grey-1); }
  .card .title { font-weight: 600; font-size: 15.5px; line-height: 1.35; cursor: pointer; }
  .card .title:hover { text-decoration: underline; text-underline-offset: 3px; }
  .card .meta { color: var(--grey-2); font-size: 12.5px; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .card .meta .client { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--cc) 70%, black); background: color-mix(in srgb, var(--cc) 13%, white); border-radius: var(--r-xs); padding: 4px 7px; }
  .card .meta .deadline { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--paper); background: var(--ink); border-radius: var(--r-xs); padding: 4px 7px; }
  .card .meta .wait { color: var(--purple); font-weight: 600; }
  .card .meta .check { color: #0F766E; font-weight: 600; }
  .crumbs { grid-column: 2 / span 2; margin: 2px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--grey-2); display: grid; gap: 3px; }
  .crumbs .c span { font: 500 11px/1 var(--mono); color: var(--grey-1); margin-right: 8px; }
  .crumbs form { display: flex; gap: 8px; margin-top: 6px; }
  .crumbs input { flex: 1; border: 1px solid var(--line-soft); border-radius: var(--pill); padding: 7px 12px; background: var(--paper); outline: 0; font-size: 13px; }
  .crumbs input:focus { border-color: var(--ink); }
  .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .acts button { background: transparent; border: 1px solid var(--line-soft); border-radius: var(--pill); padding: 6px 11px; font-size: 12.5px; font-weight: 500; color: var(--grey-2); white-space: nowrap; }
  .acts button:hover { border-color: var(--ink); color: var(--ink); }
  .acts button.go { background: var(--ink); color: var(--lime); border-color: var(--ink); }
  .acts button.go:hover { background: #1c1c1f; }
  .acts button.tick { border-color: var(--ink); color: var(--ink); }
  .acts button.tick:hover { background: var(--lime); border-color: var(--lime); }

  /* clients view */
  .client-h { display: flex; align-items: baseline; gap: 12px; margin: 26px 0 10px 4px; }
  .client-h h3 { font: 600 20px/1.15 var(--sans); letter-spacing: -.015em; margin: 0; text-transform: capitalize; }
  .client-h .eyebrow { margin: 0; }

  /* panel */
  #panel { position: fixed; inset: 0 0 0 auto; width: min(440px, 100%); background: var(--white); border-left: 1px solid var(--line-soft); box-shadow: var(--float); padding: 26px 26px 40px; overflow: auto; z-index: 20; display: grid; align-content: start; gap: 14px; }
  #panel h3 { margin: 0; font: 600 20px/1.2 var(--sans); letter-spacing: -.015em; display: flex; justify-content: space-between; align-items: center; }
  #panel .x { background: transparent; border: 1px solid var(--line-soft); border-radius: var(--pill); width: 32px; height: 32px; }
  #panel label { display: grid; gap: 5px; font-size: 12px; color: var(--grey-2); }
  #panel label > span { font: 500 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  #panel input, #panel select, #panel textarea { border: 1px solid var(--line-soft); border-radius: var(--r-sm); padding: 9px 11px; background: var(--white); outline: 0; font-size: 14px; color: var(--ink); }
  #panel input:focus, #panel select:focus, #panel textarea:focus { border-color: var(--ink); }
  #panel textarea { min-height: 70px; resize: vertical; }
  #panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #panel .seg { display: flex; gap: 6px; }
  #panel .seg button { flex: 1; border: 1px solid var(--line-soft); background: transparent; border-radius: var(--pill); padding: 8px 0; font-size: 13px; font-weight: 500; color: var(--grey-2); }
  #panel .seg button.on { background: var(--ink); color: var(--lime); border-color: var(--ink); }
  #panel .check { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink); }
  #panel .check input { width: 18px; height: 18px; accent-color: var(--ink); }
  #panel .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  #panel .bar button { border: 1px solid var(--line-soft); background: transparent; border-radius: var(--pill); padding: 9px 14px; font-weight: 500; font-size: 13px; color: var(--grey-2); }
  #panel .bar button.save { background: var(--ink); color: var(--lime); border-color: var(--ink); font-weight: 600; }
  #panel .trail { border-top: 1px solid var(--line-soft); padding-top: 12px; font-size: 13px; color: var(--grey-2); display: grid; gap: 4px; }
  #panel .trail .eyebrow { margin-bottom: 4px; }
  #panel .trail span { font: 500 11px/1 var(--mono); color: var(--grey-1); margin-right: 8px; }

  /* modal */
  #modal { position: fixed; inset: 0; background: rgba(10,10,10,.5); display: grid; place-items: center; z-index: 30; padding: 20px; }
  #modal .m { background: var(--white); border-radius: var(--r-lg); padding: 26px 28px; width: min(560px, 100%); max-height: 86vh; overflow: auto; display: grid; gap: 14px; box-shadow: var(--float); }
  #modal h3 { margin: 0; font: 600 22px/1.15 var(--sans); letter-spacing: -.015em; }
  #modal p { margin: 0; color: var(--grey-2); }
  #modal .item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line-soft); }
  #modal .item .t { font-weight: 600; font-size: 14px; }
  #modal .item .s { color: var(--grey-2); font-size: 12px; }
  #modal select { border: 1px solid var(--line-soft); border-radius: var(--pill); padding: 7px 12px; background: var(--white); }
  #modal .bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  #modal .bar button { border: 1px solid var(--line-soft); background: transparent; border-radius: var(--pill); padding: 9px 16px; font-weight: 500; }
  #modal .bar button.go { background: var(--ink); color: var(--lime); border-color: var(--ink); font-weight: 600; }

  #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 11px 18px; border-radius: var(--pill); font-size: 14px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 40; box-shadow: var(--float); }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast b { color: var(--lime); font-weight: 600; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; }
    .nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; padding: 14px 16px; gap: 4px; }
    .nav .brand { width: 100%; margin: 0 0 8px; }
    .nav .gap, .nav .sub, .nav .keys { display: none; }
    main { padding: 16px 16px 60px; }
    .card { grid-template-columns: auto 1fr; }
    .card.sortable { grid-template-columns: auto auto 1fr; }
    .acts { grid-column: 1 / -1; justify-content: flex-start; }
    .crumbs { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div id="auth">
  <form id="authForm" autocomplete="on">
    <div class="eyebrow" style="color:#8B8B8F">Taskboard</div>
    <h1>What's <i>next</i>.</h1>
    <input type="email" id="email" placeholder="Email" required autocomplete="username">
    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
    <label class="remember"><input type="checkbox" id="remember" checked> Remember me on this computer</label>
    <button type="submit" style="background:#C6FF3D;color:#0A0A0A;border:0;border-radius:999px;padding:12px 18px;font-weight:700">Sign in</button>
    <div class="err" id="authErr"></div>
  </form>
</div>

<div id="app" hidden>
  <aside class="nav">
    <div class="brand">Task<i>board</i></div>
    <button data-view="now">Now <span class="n" id="n-now"></span></button>
    <button data-view="today" class="on">Today <span class="n" id="n-today"></span></button>
    <button data-view="clients">By client <span class="n" id="n-clients"></span></button>
    <button data-view="waiting">Waiting <span class="n" id="n-waiting"></span></button>
    <button data-view="checkins">Check-ins <span class="n" id="n-checkins"></span></button>
    <button data-view="inbox">Inbox <span class="n" id="n-inbox"></span></button>
    <button data-view="later">Later <span class="n" id="n-later"></span></button>
    <button data-view="done">Done <span class="n" id="n-done"></span></button>
    <div class="legend" id="legend" hidden></div>
    <div class="gap"></div>
    <div class="keys"><span style="white-space:nowrap"><kbd>/</kbd> add</span> &nbsp; <span style="white-space:nowrap"><kbd>p</kbd> park</span> &nbsp; <span style="white-space:nowrap"><kbd>r</kbd> resume</span> &nbsp; <span style="white-space:nowrap"><kbd>esc</kbd> close</span></div>
    <button id="roll" style="color:#F5F4EF">Roll the day</button>
    <button id="signout">Sign out</button>
  </aside>

  <main>
    <form id="quick" autocomplete="off">
      <div class="box">
        <input id="q" placeholder="Add a task… e.g. check the bid change results @agency thu should">
        <button type="submit">Add</button>
      </div>
      <div class="preview" id="qPreview"></div>
    </form>
    <section id="view"></section>
  </main>
</div>

<aside id="panel" hidden></aside>
<div id="modal" hidden></div>
<div id="toast"></div>

<script>
(function () {
  "use strict";
  // ------------------------------------------------------------------ config
  var SUPABASE_URL = "https://rsodhtvvhxsvhsvnhptk.supabase.co";
  var SUPABASE_KEY = "sb_publishable_AdZyGh8BHd4HlmYVP-xALw_AzBBYRJ6";
  var OPEN = ["inbox", "today", "doing", "paused", "waiting", "later", "someday"];
  var PRIO = { must: 0, should: 1, could: 2 };
  var MUST_CAP = 3;
  var DONE_DAYS = 7;

  // "Remember me" decides where the session lives: localStorage survives closing the browser,
  // sessionStorage ends with the tab. The choice is kept so the same store is read next load.
  function rememberFlag() { try { return localStorage.getItem("tb_remember") !== "no"; } catch (e) { return true; } }
  function makeClient(remember) {
    var store; try { store = remember ? window.localStorage : window.sessionStorage; } catch (e) { store = undefined; }
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storage: store, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  }
  var sbRemember = rememberFlag();
  var sb = makeClient(sbRemember);
  var state = { tasks: [], view: "today", user: null, timer: null };
  var drag = { id: null };
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  // ------------------------------------------------------------------ dates
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return ymd(new Date()); }
  function addDays(n, from) { var d = from ? new Date(from + "T12:00:00") : new Date(); d.setDate(d.getDate() + n); return ymd(d); }
  var WD = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  function parseDate(s) {
    if (!s) return null;
    s = String(s).trim().toLowerCase();
    if (s === "today") return todayStr();
    if (s === "tomorrow" || s === "tmrw") return addDays(1);
    if (s === "next week" || s === "nextweek") return addDays(7);
    var m = s.match(/^\+(\d+)d$/); if (m) return addDays(+m[1]);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    m = s.match(/^(\d{1,2})[\/-](\d{1,2})$/); if (m) { var y = new Date().getFullYear(); return y + "-" + pad(+m[2]) + "-" + pad(+m[1]); }
    var i = WD.indexOf(s.slice(0, 3));
    if (i >= 0 && /^(mon|tue|wed|thu|fri|sat|sun)[a-z]*$/.test(s)) {
      var now = new Date(); var delta = (i - now.getDay() + 7) % 7 || 7; return addDays(delta);
    }
    return null;
  }
  function nice(d) {
    if (!d) return "";
    var t = todayStr(); if (d === t) return "today"; if (d === addDays(1)) return "tomorrow";
    var dt = new Date(d + "T12:00:00"); var diff = Math.round((dt - new Date(t + "T12:00:00")) / 864e5);
    var day = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][dt.getDay()];
    if (diff > 1 && diff < 7) return day;
    return day + " " + dt.getDate() + " " + ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][dt.getMonth()];
  }
  function stamp(iso) {
    var d = new Date(iso); var t = todayStr();
    var hm = pad(d.getHours()) + ":" + pad(d.getMinutes());
    return (ymd(d) === t ? "" : nice(ymd(d)) + " ") + hm;
  }
  function nowIso() { return new Date().toISOString(); }

  // ------------------------------------------------------------------ util
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function toast(html) { var t = $("#toast"); t.innerHTML = html; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("show"); }, 2600); }
  function byId(id) { return state.tasks.filter(function (t) { return t.id === id; })[0]; }
  function sortKey(a, b) {
    // Her manual order first (null = not ordered yet, goes after), then priority, do-date, id.
    var xa = a.position == null ? Infinity : a.position, xb = b.position == null ? Infinity : b.position;

    var musts = mustsToday(keepId);
    var m = $("#modal"); m.hidden = false;
    m.innerHTML = '<div class="m"><h3>Today already holds three musts</h3><p>That\'s the limit, on purpose. Which one moves? Or keep all four.</p>' +
      musts.map(function (t) { return '<div class="item"><div><div class="t">' + esc(t.title) + '</div><div class="s">' + esc(t.client || "") + "</div></div><button data-move=\"" + t.id + '">Move to tomorrow</button></div>'; }).join("") +
      '<div class="bar"><button data-close>Cancel</button><button class="go" data-keep>Keep all four</button></div></div>';
    m.onclick = function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-close")) { m.hidden = true; return; }
      if (b.hasAttribute("data-keep")) { m.hidden = true; then(); return; }
      if (b.dataset.move) { var id = +b.dataset.move; var t = byId(id); m.hidden = true; update(id, { status: "later", do_date: addDays(1), rolled: (t.rolled || 0) + 1 }, "moved to make room").then(then); }
    };
  }

  // ------------------------------------------------------------------ roll the day
  function rollDay() {
    var t = todayStr();
    var rows = state.tasks.filter(function (x) { return ["today", "doing", "paused"].indexOf(x.status) >= 0 || (x.do_date && x.do_date <= t && (x.status === "later" || x.status === "inbox")); }).sort(sortKey);
    var m = $("#modal"); m.hidden = false;
    if (!rows.length) { m.innerHTML = '<div class="m"><h3>Today is clear</h3><p>Nothing to roll.</p><div class="bar"><button class="go" data-close>Close</button></div></div>'; m.onclick = function () { m.hidden = true; }; return; }
    var opts = '<option value="tomorrow">Tomorrow</option><option value="+2d">Day after</option><option value="mon">Monday</option><option value="fri">Friday</option><option value="someday">Someday</option><option value="done">Done, actually</option><option value="drop">Drop it</option><option value="keep">Leave on today</option>';
    m.innerHTML = '<div class="m"><h3>Roll the day</h3><p>' + rows.length + " still on today. Each one gets a choice, and tomorrow is fine.</p>" +
      rows.map(function (x) { return '<div class="item"><div><div class="t">' + esc(x.title) + '</div><div class="s">' + esc(x.client || "") + (x.rolled ? " · rolled ×" + x.rolled : "") + "</div></div><select data-roll=\"" + x.id + '">' + opts + "</select></div>"; }).join("") +
      '<div class="bar"><button data-close>Cancel</button><button class="go" data-go>Roll</button></div></div>';
    m.onclick = function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-close")) { m.hidden = true; return; }
      if (b.hasAttribute("data-go")) {
        var ops = $$("select[data-roll]", m).map(function (s) { return { id: +s.dataset.roll, to: s.value }; });
        m.hidden = true;
        ops.reduce(function (p, o) {
          return p.then(function () {
            if (o.to === "keep") return; if (o.to === "done") return act.done(o.id); if (o.to === "drop") return act.drop(o.id);
            return act.move(o.id, o.to);
          });
        }, Promise.resolve()).then(function () { toast("Rolled. <b>Day closed.</b>"); });
      }
    };
  }

  // ------------------------------------------------------------------ edit panel
  function openPanel(id) {
    var t = byId(id); if (!t) return; var P = $("#panel"); P.hidden = false;
    var seg = function (name, opts, cur) { return '<div class="seg" data-seg="' + name + '">' + opts.map(function (o) { return '<button type="button" data-v="' + o + '"' + (cur === o ? ' class="on"' : "") + ">" + o + "</button>"; }).join("") + "</div>"; };
    P.innerHTML = '<h3>#' + t.id + ' <button class="x" data-close title="Close">×</button></h3>' +
      '<label><span>Next action</span><input id="f-title" value="' + esc(t.title) + '"></label>' +
      '<label><span>Client</span><input id="f-client" list="clientList" value="' + esc(t.client || "") + '"><datalist id="clientList">' + clients().map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + "</datalist></label>" +
      '<label><span>Priority</span>' + seg("priority", ["must", "should", "could"], t.priority) + "</label>" +
      '<label><span>Size</span>' + seg("size", ["5min", "30min", "deep"], t.size) + "</label>" +
      '<div class="row"><label><span>Do on</span><input type="date" id="f-do" value="' + esc(t.do_date || "") + '"></label><label><span>Deadline</span><input type="date" id="f-deadline" value="' + esc(t.deadline || "") + '"></label></div>' +
      '<div class="row"><label><span>Check on</span><input type="date" id="f-check" value="' + esc(t.check_on || "") + '"></label><label><span>Status</span><select id="f-status">' + OPEN.map(function (s) { return '<option' + (t.status === s ? " selected" : "") + ">" + s + "</option>"; }).join("") + "</select></label></div>" +
      '<div class="row"><label><span>Waiting on</span><input id="f-wait" value="' + esc(t.waiting_on || "") + '" placeholder="who"></label><label><span>Chase on</span><input type="date" id="f-nudge" value="' + esc(t.nudge_on || "") + '"></label></div>' +
      '<label><span>Notes</span><textarea id="f-notes">' + esc(t.notes || "") + "</textarea></label>" +
      '<label class="check"><input type="checkbox" id="f-dread"' + (t.dread ? " checked" : "") + "> I'm dreading this one</label>" +
      '<div class="bar"><button class="save" data-save>Save</button><button data-someday>Someday</button><button data-drop>Drop</button></div>' +
      '<div class="trail"><div class="eyebrow">Trail</div>' + (t.breadcrumbs || []).slice().reverse().map(function (c) { return "<div><span>" + esc(stamp(c.at)) + "</span>" + esc(c.note) + "</div>"; }).join("") + "</div>";
    P.onclick = function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-close")) { closePanel(); return; }
      if (b.closest("[data-seg]")) { var on = b.classList.contains("on"); $$("button", b.closest("[data-seg]")).forEach(function (x) { x.classList.remove("on"); }); if (!on) b.classList.add("on"); return; }
      if (b.hasAttribute("data-someday")) { closePanel(); act.move(id, "someday").then(function () { toast("Someday. It's a place, not a failure."); }); return; }
      if (b.hasAttribute("data-drop")) { closePanel(); act.drop(id); return; }
      if (b.hasAttribute("data-save")) {
        var v = function (s) { return $(s, P).value.trim() || null; };
        var segv = function (n) { var on = $('[data-seg="' + n + '"] .on', P); return on ? on.dataset.v : null; };
        var patch = { title: v("#f-title") || t.title, client: v("#f-client"), priority: segv("priority"), size: segv("size"), do_date: v("#f-do"), deadline: v("#f-deadline"), check_on: v("#f-check"), status: v("#f-status"), waiting_on: v("#f-wait"), nudge_on: v("#f-nudge"), notes: v("#f-notes"), dread: $("#f-dread", P).checked };
        if (patch.waiting_on && patch.status !== "waiting" && t.status !== "waiting") patch.status = "waiting";
        if (patch.waiting_on && patch.status === "waiting" && !patch.nudge_on) patch.nudge_on = addDays(3);
        var changed = Object.keys(patch).filter(function (k) { return String(patch[k] == null ? "" : patch[k]) !== String(t[k] == null ? "" : t[k]); });
        if (!changed.length) { closePanel(); return; }
        var save = function () { closePanel(); update(id, patch, "edited " + changed.join(", ")).then(function () { toast("Saved #" + id); }); };
        if (patch.priority === "must" && ["today", "doing", "paused"].indexOf(patch.status) >= 0 && mustsToday(id).length >= MUST_CAP && !(t.priority === "must" && ["today", "doing", "paused"].indexOf(t.status) >= 0)) return mustChooser(id, save);
        save();
      }
    };
    setTimeout(function () { $("#f-title", P).focus(); }, 30);
  }
  function closePanel() { var P = $("#panel"); P.hidden = true; P.innerHTML = ""; }

  // ------------------------------------------------------------------ events
  $("#view").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    var id = +b.dataset.id, a = b.dataset.act;
    if (a === "edit") return openPanel(id);
    if (a === "toToday") { var t = byId(id); return (t.priority === "must" && mustsToday(id).length >= MUST_CAP) ? mustChooser(id, function () { return update(id, { status: "today", do_date: todayStr() }, "moved to today"); }) : update(id, { status: "today", do_date: todayStr() }, "moved to today"); }
    if (a === "reopen") return update(id, { status: "today", do_date: todayStr() }, "reopened");
    if (a === "park") { var card = b.closest(".card"); var inp = card && $(".crumbs input", card); return act.park(id, inp && inp.value.trim()); }
    if (act[a]) act[a](id);
  });
  $("#view").addEventListener("submit", function (e) {
    var f = e.target.closest("form[data-note]"); if (!f) return; e.preventDefault();
    var inp = $("input", f); var v = inp.value.trim(); if (!v) return; act.note(+f.dataset.note, v); inp.value = "";
  });

  // ------------------------------------------------------------------ her order (Today list)
  // Drag a card by its ⋮⋮ grip, or focus the grip and use the arrow keys. The DOM order of the
  // group becomes positions 1..n; only changed rows are written. No breadcrumb: ordering is noise.
  function clearOver() { $$(".card.over-before, .card.over-after").forEach(function (c) { c.classList.remove("over-before", "over-after"); }); }
  function saveOrder(groupEl, focusId) {
    var ids = $$(".card", groupEl).map(function (c) { return +c.dataset.id; }), writes = [];
    ids.forEach(function (id, i) {
      var t = byId(id); if (!t || t.position === i + 1) return;
      t.position = i + 1; writes.push(sb.from("tasks").update({ position: i + 1 }).eq("id", id));
    });
    render();
    if (focusId != null) { var g = $('.grip[data-grip="' + focusId + '"]'); if (g) g.focus(); }
    if (!writes.length) return Promise.resolve();
    return Promise.all(writes).then(function (rs) {
      var bad = rs.filter(function (r) { return r.error; })[0];
      if (bad) { toast("Couldn't save the order: " + esc(bad.error.message)); return load(); }
    });
  }
  function nudgeCard(id, dir) {
    var c = $('.card.sortable[data-id="' + id + '"]'); if (!c) return;
    var sib = dir < 0 ? c.previousElementSibling : c.nextElementSibling;
    if (!sib || !sib.classList.contains("card")) return;
    c.parentNode.insertBefore(dir < 0 ? c : sib, dir < 0 ? sib : c);
    saveOrder(c.parentNode, id);
  }
  $("#view").addEventListener("mousedown", function (e) { var g = e.target.closest(".grip"); if (g) g.closest(".card").draggable = true; });
  document.addEventListener("mouseup", function () { if (drag.id == null) $$(".card[draggable=true]").forEach(function (c) { c.draggable = false; }); });
  $("#view").addEventListener("dragstart", function (e) {
    var c = e.target.closest ? e.target.closest(".card.sortable") : null; if (!c || !c.draggable) return;
    drag.id = +c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", String(drag.id)); } catch (x) {}
  });
  $("#view").addEventListener("dragover", function (e) {
    if (drag.id == null) return; var c = e.target.closest(".card.sortable"); if (!c || +c.dataset.id === drag.id) return;
    e.preventDefault(); e.dataTransfer.dropEffect = "move";
    var r = c.getBoundingClientRect(); clearOver(); c.classList.add(e.clientY < r.top + r.height / 2 ? "over-before" : "over-after");
  });
  $("#view").addEventListener("drop", function (e) {
    if (drag.id == null) return; var c = e.target.closest(".card.sortable"); if (!c) return; e.preventDefault();
    var from = $('.card[data-id="' + drag.id + '"]', c.parentNode); clearOver(); drag.id = null;
    if (!from || from === c) return;
    var r = c.getBoundingClientRect(); c.parentNode.insertBefore(from, e.clientY < r.top + r.height / 2 ? c : c.nextSibling);
    saveOrder(c.parentNode, null);
  });
  $("#view").addEventListener("dragend", function (e) {
    var c = e.target.closest ? e.target.closest(".card") : null; if (c) { c.classList.remove("dragging"); c.draggable = false; }
    drag.id = null; clearOver();
  });
  $$(".nav button[data-view]").forEach(function (b) { b.addEventListener("click", function () { state.view = b.dataset.view; render(); window.scrollTo(0, 0); }); });
  $("#roll").addEventListener("click", rollDay);
  $("#legend").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-client]"); if (!b) return;
    state.view = "clients"; render();
    var el = document.getElementById("client-" + b.dataset.client); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("#quick").addEventListener("submit", submitQuick);
  $("#q").addEventListener("input", previewQuick);
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase(); var typing = tag === "input" || tag === "textarea" || tag === "select";
    if (e.key === "Escape") { closePanel(); $("#modal").hidden = true; if (typing) e.target.blur(); return; }
    if (e.target.classList && e.target.classList.contains("grip") && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); return nudgeCard(+e.target.dataset.grip, e.key === "ArrowUp" ? -1 : 1); }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
    else if (e.key === "p") { var d = state.tasks.filter(function (t) { return t.status === "doing"; })[0]; if (d) act.park(d.id); else toast("Nothing is marked as doing."); }
    else if (e.key === "r") { act.resume(); }
    else if (e.key === "t") { state.view = "today"; render(); }
    else if (e.key === "n") { state.view = "now"; render(); }
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && state.user) load(); });

  // ------------------------------------------------------------------ auth
  function showApp(session) {
    state.user = session.user; $("#auth").hidden = true; $("#app").hidden = false; load();
    clearInterval(state.timer); state.timer = setInterval(load, 60000);
  }
  $("#remember").checked = sbRemember;
  $("#authForm").addEventListener("submit", function (e) {
    e.preventDefault(); $("#authErr").textContent = "";
    var remember = $("#remember").checked;
    try { localStorage.setItem("tb_remember", remember ? "yes" : "no"); } catch (x) {}
    if (remember !== sbRemember) { sbRemember = remember; sb = makeClient(remember); }
    sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#password").value }).then(function (r) {
      if (r.error) { $("#authErr").textContent = r.error.message; return; }
      showApp(r.data.session);
    });
  });
  $("#signout").addEventListener("click", function () { sb.auth.signOut().then(function () { location.reload(); }); });
  sb.auth.getSession().then(function (r) { if (r.data.session) showApp(r.data.session); });
})();
</script>
</body>
</html>
